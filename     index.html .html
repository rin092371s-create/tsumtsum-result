<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08a1d1">
<title>ツムツム リザルト記録</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef8fc;color:#17313d;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#08a1d1;color:white;padding:calc(14px + env(safe-area-inset-top)) 18px 16px;position:sticky;top:0;z-index:2}
h1{font-size:20px;margin:0 0 3px}.sub{font-size:12px;opacity:.9}main{max-width:620px;margin:auto;padding:16px}
.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #00000010}
input[type=file]{display:none}.pick{display:block;text-align:center;padding:17px;border-radius:14px;background:#ffb400;color:#332100;font-weight:700;font-size:17px}
button{border:0;border-radius:12px;padding:12px 15px;font-size:15px;font-weight:700;background:#0b9bc9;color:white}.secondary{background:#e7f3f7;color:#176277}
.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.preview{width:100%;max-height:420px;object-fit:contain;border-radius:12px;background:#dcecf2;margin-top:12px}
.status{font-size:13px;color:#58727c;margin-top:10px;min-height:20px}.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{background:#f2f9fb;border-radius:14px;padding:14px}
.label{font-size:12px;color:#62818b}.value{font-size:25px;font-weight:800;margin-top:3px}.edit{width:100%;border:1px solid #c9dfe6;border-radius:10px;padding:7px;background:#fff;color:#17313d;font-family:inherit}.edit:focus{outline:2px solid #08a1d1;border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 5px;border-bottom:1px solid #e3eef1;text-align:right}th:first-child,td:first-child{text-align:left}
.empty{text-align:center;color:#78919a;padding:18px}.small{font-size:11px;color:#718890;line-height:1.6}
</style></head>
<body>
<header><h1>ツムツム リザルト記録</h1><div class="sub">スクショ → スコア・コインを自動認識</div></header>
<main>
<section class="card">
<label class="pick" for="files">📷 リザルトのスクショを選択</label>
<input id="files" type="file" accept="image/*" multiple>
<div id="status" class="status"></div><img id="preview" class="preview" hidden>
</section>
<section class="card">
<div class="results">
<div class="result"><div class="label">スコア（修正できます）</div><input id="score" class="value edit" inputmode="numeric" type="text" placeholder="—"></div>
<div class="result"><div class="label">コイン（修正できます）</div><input id="coins" class="value edit" inputmode="numeric" type="text" placeholder="—"></div>
</div>
<div class="row" style="margin-top:12px"><button id="save" disabled>この結果を記録</button><button id="clear" class="secondary">全記録を削除</button></div>
<p class="small">OCRはブラウザ上で実行する試作品です。初回はOCRエンジンの読み込みに時間がかかります。</p>
</section>
<section class="card"><h2 style="font-size:17px;margin:0 0 12px">集計</h2><div id="summary" class="small"></div></section>
<section class="card"><h2 style="font-size:17px;margin:0 0 8px">記録</h2><div id="history" class="empty">まだ記録がありません</div></section>
</main>
<script>
const SCORE_ROI=[.08,.335,.93,.418], COIN_ROI=[.44,.505,.78,.585];
let current={score:null,coins:null,file:null}; const $=id=>document.getElementById(id);
function crop(img,roi,scale=3){const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*(roi[2]-roi[0])*scale);c.height=Math.round(img.naturalHeight*(roi[3]-roi[1])*scale);c.getContext('2d').drawImage(img,img.naturalWidth*roi[0],img.naturalHeight*roi[1],img.naturalWidth*(roi[2]-roi[0]),img.naturalHeight*(roi[3]-roi[1]),0,0,c.width,c.height);return c}
function parse(t){let a=(t.match(/\d[\d,]*/g)||[]).map(s=>({s,d:s.replace(/\D/g,''),c:/^\d{1,3}(,\d{3})+$/.test(s)})).filter(x=>x.d.length>=2);a.sort((x,y)=>(y.c-x.c)||(y.d.length-x.d.length));return a[0]?Number(a[0].d):null}
async function ocr(c,label){let r=await Tesseract.recognize(c,'eng',{logger:m=>{if(m.status==='recognizing text')$('status').textContent=label+'を認識中… '+Math.round((m.progress||0)*100)+'%'}});return parse(r.data.text)}
function fmt(n){return n==null?'—':n.toLocaleString('ja-JP')}
function rows(){return JSON.parse(localStorage.getItem('tsumRows')||'[]')}
function render(){let a=rows();if(!a.length){$('history').innerHTML='<div class="empty">まだ記録がありません</div>';$('summary').textContent='プレイ数 0 ｜ 累計コイン 0 ｜ 平均コイン 0 ｜ 最高スコア 0';return}let tc=a.reduce((s,r)=>s+r.coins,0),bs=Math.max(...a.map(r=>r.score));$('summary').textContent=`プレイ数 ${a.length} ｜ 累計コイン ${fmt(tc)} ｜ 平均コイン ${fmt(Math.round(tc/a.length))} ｜ 最高スコア ${fmt(bs)}`;$('history').innerHTML='<table><thead><tr><th>日時</th><th>スコア</th><th>コイン</th></tr></thead><tbody>'+a.slice().reverse().map(r=>`<tr><td>${new Date(r.time).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${fmt(r.score)}</td><td>${fmt(r.coins)}</td></tr>`).join('')+'</tbody></table>'}
$('files').onchange=async e=>{let f=e.target.files[0];if(!f)return;current={score:null,coins:null,file:f};$('save').disabled=true;$('score').value=$('coins').value='';let u=URL.createObjectURL(f),img=new Image();img.onload=async()=>{$('preview').src=u;$('preview').hidden=false;try{$('status').textContent='OCRエンジンを準備中…';current.score=await ocr(crop(img,SCORE_ROI),'スコア');current.coins=await ocr(crop(img,COIN_ROI),'コイン');$('score').value=current.score!=null?String(current.score):'';$('coins').value=current.coins!=null?String(current.coins):'';$('save').disabled=false;$('status').textContent='認識完了。内容を確認して記録してください。'}catch(err){console.error(err);$('status').textContent='OCRに失敗しました。ページを再読み込みして再試行してください。'}};img.src=u}
$('save').onclick=()=>{let score=Number($('score').value.replace(/\D/g,'')),coins=Number($('coins').value.replace(/\D/g,''));if(!score||!coins){$('status').textContent='スコアとコインを入力してください。';return}current.score=score;current.coins=coins;let a=rows();a.push({time:new Date().toISOString(),score:score,coins:coins});localStorage.setItem('tsumRows',JSON.stringify(a));render();$('status').textContent='記録しました。'}
$('clear').onclick=()=>{if(confirm('すべての記録を削除しますか？')){localStorage.removeItem('tsumRows');render()}}
render();
</script></body></html>
